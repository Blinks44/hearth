name: Feature Request
description: Suggest a new tool, platform capability, or UX improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What workflow or pain point in your local dev environment would this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How should Hearth detect, display, or manage this? Include relevant CLI commands or config file paths if known.
    validations:
      required: true

  - type: checkboxes
    id: platforms
    attributes:
      label: Relevant Platforms
      options:
        - label: macOS
        - label: Windows
        - label: Linux
