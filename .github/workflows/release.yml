name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  prepare:
    name: Validate version & prepare draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches mygo.json version
        id: meta
        run: |
          version="$(jq -r .version mygo.json)"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::mygo.json is missing version"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mygo.json version v$version"
            exit 1
          fi
          prerelease="false"
          base="${version%%+*}"
          if [[ "$base" == *-* ]]; then
            prerelease="true"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            notes=""
            if [ -f CHANGELOG.md ]; then
              notes="$(awk -v ver="$VERSION" '
                /^## / {
                  if (found) exit
                  if (index($0, "## [" ver "]") == 1 || index($0, "## " ver " ") == 1 || $0 == "## " ver) { found = 1; next }
                }
                found { lines[++n] = $0 }
                END {
                  s = 1; while (s <= n && lines[s] ~ /^[[:space:]]*$/) s++
                  e = n; while (e >= s && lines[e] ~ /^[[:space:]]*$/) e--
                  for (i = s; i <= e; i++) print lines[i]
                }
              ' CHANGELOG.md)"
            fi
            args=(release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME")
            if [ -n "$notes" ]; then
              args+=(--notes "$notes")
            else
              args+=(--generate-notes)
            fi
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi

  build:
    needs: prepare
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: "darwin/universal"
            attest_paths: |
              build/darwin-universal/*.dmg
              build/darwin-universal/*.tar.gz
              build/darwin-universal/install.sh
          - name: Windows
            os: ubuntu-latest
            platform: "windows/amd64,windows/arm64"
            attest_paths: |
              build/windows-*/*-setup-*.exe
              build/windows-*/*.tar.gz
              build/windows-*/install.ps1
          - name: Linux
            os: ubuntu-latest
            platform: "linux/amd64,linux/arm64"
            attest_paths: |
              build/linux-*/*.deb
              build/linux-*/*.rpm
              build/linux-*/*.tar.gz
              build/linux-*/install.sh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install NSIS for Windows installers
        if: matrix.name == 'Windows' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "${MYGO_UPDATER_PRIVATE_KEY:-}" ]; then
            echo "::error::MYGO_UPDATER_PRIVATE_KEY secret is required to sign updates"
            exit 1
          fi
          go tool mygo build -platform "${{ matrix.platform }}"
          mkdir -p dist
          shopt -s nullglob
          for f in build/*/*.dmg build/*/*-setup-*.exe build/*/*.deb build/*/*.rpm build/*/*.tar.gz build/*/*.delta build/*/update-*.json build/*/install.sh build/*/install.ps1; do
            cp "$f" dist/
          done
          ls -la dist
      - name: Stage release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/
          retention-days: 1
          if-no-files-found: error
      - name: Attest build provenance
        # GitHub Artifact Attestations require a public repository on personal accounts.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.attest_paths }}

  finalize:
    needs: [prepare, build]
    name: Upload assets & SHA256SUMS
    runs-on: ubuntu-latest
    steps:
      - name: Download staged release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: downloaded
      - name: Compute SHA256SUMS and upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          for f in downloaded/release-*/*; do
            cp "$f" release-assets/
          done
          (
            cd release-assets
            shopt -s nullglob
            files=(*.dmg *.exe *.deb *.rpm *.tar.gz *.delta install.sh install.ps1)
            manifests=(update-*.json)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::No release assets found"
              exit 1
            fi
            if [ "${#manifests[@]}" -eq 0 ]; then
              echo "::error::No update manifests found"
              exit 1
            fi
            IFS=$'\n' sorted=($(printf '%s\n' "${files[@]}" | LC_ALL=C sort))
            unset IFS
            sha256sum "${sorted[@]}" > SHA256SUMS
            cp SHA256SUMS SHA256SUMS.txt
            cat SHA256SUMS
            # Upload payloads and checksums first, then manifests last so
            # manifests never reference missing files.
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
              "${sorted[@]}" SHA256SUMS SHA256SUMS.txt
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
              "${manifests[@]}"
          )
