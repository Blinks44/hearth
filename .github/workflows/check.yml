name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    # PowerShell splits `-modfile=tools/go.mod` at the dot; Git Bash is available on Windows runners.
    shell: bash

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Format
        run: go tool -modfile=tools/go.mod golangci-lint fmt --diff
      - name: Lint
        run: go tool -modfile=tools/go.mod golangci-lint run
      - name: mygo vet
        run: go tool mygo vet .
      - name: Catalogs
        run: go tool mygo i18n check
      - name: Test
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Test (Windows, no race detector without cgo toolchain)
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Integration (real shell and registry)
        run: go test -tags integration -v -run Real ./internal/sysenv/
      - name: End-to-end (built app through the automation plugin)
        if: runner.os == 'macOS'
        run: make e2e
